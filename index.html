<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>춘천고등학교 성적분석ON</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background-color: #080b14; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      #app-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #080b14; z-index: 9999; transition: opacity 0.3s ease; }
      #app-loading.fade-out { opacity: 0; pointer-events: none; }
      .loading-logo { width: 68px; height: 68px; border-radius: 14px; background: linear-gradient(135deg, #3b5bdb, #4c6ef5); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 32px rgba(99, 102, 241, 0.25); }
      .loading-logo svg { width: 34px; height: 34px; stroke: white; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .loading-spinner { width: 20px; height: 20px; border: 2px solid #1a2035; border-top-color: #fbbf24; border-radius: 50%; animation: spin 0.8s linear infinite; }
      .loading-text { font-size: 18px; color: #6b8ab5; letter-spacing: 0.05em; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app-loading">
      <div class="loading-logo">
        <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-6"/></svg>
      </div>
      <div class="loading-spinner"></div>
      <div class="loading-text">성적분석ON 불러오는 중</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
